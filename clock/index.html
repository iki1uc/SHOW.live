<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TIME · TEM‑ROOT · iki1uc</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:40px;
}
h1 {
    color:#0ff;
    text-shadow:0 0 14px #0ff;
    text-align:center;
    margin-bottom:40px;
    font-size:34px;
}
.panel {
    background:#111;
    border-left:4px solid #0ff;
    padding:22px;
    margin-bottom:35px;
    border-radius:8px;
}
.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}
pre {
    background:#000;
    padding:15px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}
</style>

<script type="module">

import { CLOCK_ENGINE } from "./CLOCK.engine.js";
import { CLOCK_RUN } from "./clock.run.js";
import { CLOCK_PIPE } from "./CLOCK_PIPE.js";   // FIXED
import { OC } from "./OC.js";

/* ============================
   TIME = TEM‑Ebene
   folgt ROOT‑CLOCK
   ============================ */

let ROOT_CLOCK = 0;
let TIME_CLOCK = 0;

setInterval(()=>{
    ROOT_CLOCK++;
    TIME_CLOCK = ROOT_CLOCK * 3; // TEM‑Multiplikator

    const engine = CLOCK_ENGINE(ROOT_CLOCK);
    const run    = CLOCK_RUN(TIME_CLOCK);
    const pipe   = CLOCK_PIPE(TIME_CLOCK);
    const oc     = OC(TIME_CLOCK);

    updatePanels(engine, run, pipe, oc);

}, 111);


/* ============================
   PANELS
   ============================ */

function panelRoot(){
return `
ROOT‑CLOCK (äußere Uhr)
Frame: ${ROOT_CLOCK}
Zeiger: ↻ ${" ".repeat(ROOT_CLOCK % 12)}↻
Sequenz: iki → bir → uc → iki1uc
`;
}

function panelTime(){
return `
TIME‑CLOCK (innere Uhr)
TIME.clock = ${TIME_CLOCK}
Zeiger: ↺ ${" ".repeat(TIME_CLOCK % 12)}↺
Modus: 3×11 / Scroll / Zoom
Bindung: folgt ROOT‑CLOCK
`;
}

function panelEngine(engine){
return `
ENGINE
${JSON.stringify(engine, null, 2)}
`;
}

function panelRun(run){
return `
RUN
${JSON.stringify(run, null, 2)}
`;
}

function panelPipe(pipe){
return `
PIPE
${JSON.stringify(pipe, null, 2)}
`;
}

function panelOC(oc){
return `
OC.js
${JSON.stringify(oc, null, 2)}
`;
}

function updatePanels(engine, run, pipe, oc){
    document.getElementById("root").textContent = panelRoot();
    document.getElementById("time").textContent = panelTime();
    document.getElementById("engine").textContent = panelEngine(engine);
    document.getElementById("run").textContent = panelRun(run);
    document.getElementById("pipe").textContent = panelPipe(pipe);
    document.getElementById("oc").textContent = panelOC(oc);
}

</script>

</head>

<body>

<h1>TIME · TEM‑ROOT · iki1uc</h1>

<div class="panel"><div class="title">ROOT‑CLOCK</div><pre id="root"></pre></div>
<div class="panel"><div class="title">TIME‑CLOCK</div><pre id="time"></pre></div>
<div class="panel"><div class="title">ENGINE</div><pre id="engine"></pre></div>
<div class="panel"><div class="title">RUN</div><pre id="run"></pre></div>
<div class="panel"><div class="title">PIPE</div><pre id="pipe"></pre></div>
<div class="panel"><div class="title">OC.js</div><pre id="oc"></pre></div>

</body>
</html>
