<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🕊️ FRIEDENS-INDEX · SHOW.live · RING · DOCH · 3×3</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a12;
      color: #d0d9e6;
      font-family: 'Consolas', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: radial-gradient(ellipse at 50% 0%, #0f1a22, #000000);
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: rgba(10,14,20,0.5);
      border: 1px solid rgba(100,200,255,0.04);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    /* HEADER */
    .header {
      text-align: center;
      border-bottom: 2px solid rgba(255,215,0,0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #7fc9ff, #ffd700, #ff66ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .sub {
      color: #3d5a70;
      font-size: 10px;
      letter-spacing: 4px;
      margin-top: 4px;
    }
    .header .sub span { color: #ffd700; }

    /* MIR/DOCH PULSE */
    .core {
      text-align: center;
      padding: 20px 0;
    }
    .mir {
      font-size: 48px;
      color: #0f0;
      animation: mirPulse 1.4s infinite ease-in-out;
    }
    .doch {
      font-size: 32px;
      color: #f33;
      margin-top: 6px;
      animation: dochGlow 2.2s infinite ease-in-out;
    }

    @keyframes mirPulse {
      0%   { opacity: 0.4; transform: scale(0.95); }
      50%  { opacity: 1;   transform: scale(1.10); }
      100% { opacity: 0.4; transform: scale(0.95); }
    }
    @keyframes dochGlow {
      0%   { text-shadow: 0 0 4px #f33; }
      50%  { text-shadow: 0 0 18px #f33; }
      100% { text-shadow: 0 0 4px #f33; }
    }

    /* BUTTONS */
    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 12px 0;
    }
    .controls button {
      background: rgba(20,35,45,0.3);
      color: #8ab8e6;
      border: 1px solid rgba(100,200,255,0.04);
      padding: 8px 16px;
      border-radius: 18px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .controls button:hover {
      background: rgba(40,80,100,0.2);
      color: #b8e2ff;
    }
    .controls button.primary { border-color: rgba(255,215,0,0.2); color: #ffd700; }
    .controls button.primary:hover { background: rgba(255,215,0,0.05); }
    .controls button.connect { border-color: rgba(0,255,136,0.2); color: #00ff88; }
    .controls button.connect:hover { background: rgba(0,255,136,0.05); }
    .controls button.danger { border-color: rgba(255,68,68,0.2); color: #f44; }
    .controls button.danger:hover { background: rgba(255,68,68,0.05); }
    .controls button.pulse { border-color: rgba(255,102,255,0.2); color: #ff66ff; }
    .controls button.pulse:hover { background: rgba(255,102,255,0.05); }

    /* STATUS */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 8px 16px;
      margin: 12px 0;
      font-size: 9px;
      border: 1px solid rgba(255,255,255,0.02);
    }
    .status-bar .item { display: flex; align-items: center; gap: 4px; }
    .status-bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .status-bar .dot.on { background: #00ff88; box-shadow: 0 0 8px #00ff8844; }
    .status-bar .dot.off { background: #445555; }
    .status-bar .dot.pulse { background: #ff66ff; box-shadow: 0 0 8px #ff66ff44; animation: dotPulse 1s infinite; }
    @keyframes dotPulse { 0%,100%{opacity:0.4;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.2)} }

    /* LOG */
    .log {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 10px;
      font-size: 8px;
      color: #3d5a70;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid rgba(100,200,255,0.02);
      margin-top: 12px;
      line-height: 1.6;
    }
    .log .hl { color: #7fc9ff; }
    .log .ok { color: #00ff88; }
    .log .flow { color: #ffaa00; }
    .log .whirl { color: #ff66ff; }
    .log .connect { color: #00ffff; }
    .log .warn { color: #ff8844; }

    .footer {
      text-align: center;
      font-size: 7px;
      color: #1f2a36;
      margin-top: 12px;
      letter-spacing: 2px;
    }
    .footer span { color: #ffd700; }

    /* MATRIX (für RING) – unsichtbar, aber notwendig */
    #matrix { display: none; }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🕊️ FRIEDENS-INDEX</h1>
    <div class="sub">SHOW.live · RING · DOCH · 3×3 · CONNECT · <span>wieimmer4u</span></div>
  </div>

  <!-- MIR/DOCH PULSE -->
  <div class="core">
    <div class="mir">MIR</div>
    <div class="doch">DOCH</div>
  </div>

  <!-- STATUS -->
  <div class="status-bar">
    <div class="item"><span class="dot on"></span> CONNECT</div>
    <div class="item"><span class="dot pulse"></span> WHIRL</div>
    <div class="item"><span class="dot on"></span> RING</div>
    <div class="item"><span class="dot on"></span> DOCH</div>
    <div class="item"><span class="dot on"></span> DOO</div>
    <div class="item"><span class="dot on"></span> DOOR</div>
    <div class="item"><span class="dot off"></span> NC</div>
  </div>

  <!-- BUTTONS -->
  <div class="controls">
    <button class="primary" onclick="setMode('DA')">DA</button>
    <button class="primary" onclick="setMode('NE')">NE</button>
    <button class="primary" onclick="setMode('BEN')">BEN</button>
    <button class="primary" onclick="setMode('DOCH')">DOCH</button>
    <button class="primary" onclick="setMode('NEIN')">NEIN</button>
    <button class="primary" onclick="setMode('SCHWEBE')">SCHWEBE</button>
    <button class="connect" onclick="connectAll()">🔗 CONNECT ALL</button>
    <button class="connect" onclick="doSync()">🔄 SYNC</button>
    <button class="pulse" onclick="doPulse()">🌀 PULSE</button>
    <button class="pulse" onclick="doWhirl()">🌀 WHIRL</button>
    <button class="danger" onclick="resetAll()">⟲ RESET</button>
  </div>

  <!-- LOG -->
  <div class="log" id="log">
    <div>[🕊️] FRIEDENS-INDEX geladen · CONNECT bereit</div>
  </div>

  <!-- MATRIX für RING (unsichtbar) -->
  <div id="matrix"></div>

  <div class="footer">🕊️ FRIEDENS-INDEX · SHOW.live · RING · DOCH · 3×3 · <span>wieimmer4u</span></div>

</div>

<!-- ============================================================ -->
<!-- JAVASCRIPT – ALLES IN EINEM BLOCK, SAUBER, FUNKTIONAL       -->
<!-- ============================================================ -->

<!-- DOCH MODULE LADEN -->
<script type="module">
  // DOCH.switch.js muss existieren: SHOW.live/DOCH/DOCH.switch.js
  import DOCH from './DOCH/DOCH.switch.js';

  // Global setMode
  window.setMode = (mode) => {
    const result = DOCH.set(mode);
    console.log('🔄 MODE:', result);
    log(`🔄 MODUS: ${mode} · DOO: ${result.doo.active ? '✅' : '⛔'} · DOOR: ${result.door.open ? '✅' : '⛔'}`);
  };

  // Global connectAll
  window.connectAll = () => {
    setMode('DA');
    log('🔗 CONNECT ALL aktiviert', 'connect');
  };

  // Global doSync
  window.doSync = () => {
    log('🔄 SYNC durchgeführt', 'ok');
  };

  // Global doPulse
  let pulseCount = 0;
  window.doPulse = () => {
    pulseCount++;
    const sym = ['✨','⚡','🌀','🔥','💫','🌟'][pulseCount % 6];
    log(`${sym} PULSE #${pulseCount} · Energiefluss aktiv`, 'whirl');
  };

  // Global doWhirl
  let whirlActive = false;
  window.doWhirl = () => {
    whirlActive = !whirlActive;
    log(whirlActive ? '🌀 WHIRL aktiviert · PQ-Root' : '⏸ WHIRL deaktiviert', 'whirl');
  };

  // Global resetAll
  window.resetAll = () => {
    pulseCount = 0;
    whirlActive = false;
    setMode('NE');
    log('⟲ RESET · Alles zurückgesetzt', 'warn');
  };

  // Log-Funktion
  window.log = (msg, type = 'hl') => {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const cls = ['hl','ok','flow','whirl','connect','warn'].includes(type) ? type : 'hl';
    el.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 50) el.removeChild(el.firstChild);
  };

  // Initial
  setMode('NE');
  log('⌨️  1=DA  2=NE  3=BEN  4=DOCH  5=NEIN  6=SCHWEBE', 'hl');
  log('⌨️  c=CONNECT  s=SYNC  p=PULSE  w=WHIRL  x=RESET', 'hl');
</script>

<!-- TASTATUR -->
<script>
document.addEventListener('keydown', (e) => {
  if (e.key === '1') setMode('DA');
  if (e.key === '2') setMode('NE');
  if (e.key === '3') setMode('BEN');
  if (e.key === '4') setMode('DOCH');
  if (e.key === '5') setMode('NEIN');
  if (e.key === '6') setMode('SCHWEBE');
  if (e.key === 'c' || e.key === 'C') connectAll();
  if (e.key === 's' || e.key === 'S') doSync();
  if (e.key === 'p' || e.key === 'P') doPulse();
  if (e.key === 'w' || e.key === 'W') doWhirl();
  if (e.key === 'x' || e.key === 'X') resetAll();
  if (e.key === ' ') { e.preventDefault(); doPulse(); }
});
</script>

<!-- RING LADEN + AKTIVIEREN (GANZ UNTEN!) -->
<script src="../RING/RING.js"></script>
<script>
if (window.RING) {
  const matrix = document.getElementById('matrix');
  if (matrix) {
    RING.attach(matrix);
    RING.enable();
    console.log('✅ RING aktiviert · CONNECT bereit');
    log('🔗 RING aktiviert · CONNECT sichtbar', 'connect');
  } else {
    console.warn('⚠️ MATRIX fehlt – RING kann nicht verbinden');
  }
} else {
  console.warn('⚠️ RING.js nicht geladen');
}
</script>

</body>
</html>
