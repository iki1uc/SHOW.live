<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOAH · Etage 14 · Korridor 3⁹×81</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a12;
            color:#0ff;
            font-family:'Consolas', monospace;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        #etage {
            background:#0e0e1a;
            border:2px solid #4a7cff;
            border-radius:20px;
            padding:40px;
            max-width:600px;
            width:100%;
            box-shadow:0 0 80px rgba(74,124,255,0.05);
            text-align:center;
        }

        .etage-title {
            font-size:36px;
            color:#4a7cff;
            letter-spacing:6px;
            margin-bottom:10px;
        }

        .etage-level {
            font-size:18px;
            color:#4f4;
            margin-bottom:10px;
        }

        .etage-corridor {
            font-size:14px;
            color:#ffd700;
            margin-bottom:20px;
        }

        .divider {
            border:1px solid #1a1a2a;
            margin:20px 0;
        }

        .detail {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:8px;
            text-align:left;
            font-size:11px;
            color:#6a6a8a;
        }

        .label { color:#444; }
        .value { color:#0ff; }
        .value.blue { color:#4a7cff; }
        .value.gold { color:#ffd700; }
        .value.green { color:#4f4; }

        .messer {
            margin-top:20px;
            font-size:12px;
            color:#ffd700;
            text-shadow:0 0 10px rgba(255,215,0,0.2);
        }

        .footer {
            margin-top:20px;
            font-size:10px;
            color:#333;
            letter-spacing:2px;
        }
    </style>
</head>

<body>

<div id="etage">

    <div class="etage-title">NOAH · Etage 14</div>
    <div class="etage-level">Korridor: 3⁹×81</div>
    <div class="etage-corridor">Messerpunkt: Schnittstelle zum Continuum</div>

    <div class="divider"></div>

    <div class="detail">
        <div><span class="label">Status:</span> <span class="value gold">Etage aktiv</span></div>
        <div><span class="label">Flow:</span> <span class="value blue">Continuum</span></div>
        <div><span class="label">Vector:</span> <span class="value green">Energiefluss</span></div>
        <div><span class="label">SLI:</span> <span class="value blue">Darstellung</span></div>
        <div><span class="label">Brücke:</span> <span class="value gold">Verbindung offen</span></div>
        <div><span class="label">Prinzip:</span> <span class="value">Leicht · Flexibel</span></div>
    </div>

    <div class="divider"></div>

    <div class="messer">
        Messerpunkt: Werte schneiden · Übergänge öffnen · Etagen verbinden
    </div>
